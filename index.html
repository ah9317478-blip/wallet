<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظتي الشخصية - متابعة الأموال والجمعيات (أونلاين)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB__LWB21XqgeJV0HtohYBpnvElC1JJj_I",
            authDomain: "wallet-75e98.firebaseapp.com",
            projectId: "wallet-75e98",
            storageBucket: "wallet-75e98.firebasestorage.app",
            messagingSenderId: "1060313025866",
            appId: "1:1060313025866:web:dbe2b723be1ff7aa5845b3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.FB_db = db;
        window.FB_collection = collection;
        window.FB_addDoc = addDoc;
        window.FB_getDocs = getDocs;
        window.FB_deleteDoc = deleteDoc;
        window.FB_doc = doc;
        window.FB_setDoc = setDoc;

        if(window.initAppFromFirebase) {
            window.initAppFromFirebase();
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md">
        <div class="container mx-auto px-3 sm:px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center space-x-2.5 space-x-reverse w-full sm:w-auto">
                <div class="bg-emerald-500 text-slate-900 p-2 rounded-xl shadow font-black">
                    <i class="fa-solid fa-wallet text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-2xl font-black text-white">محفظتي الشخصية 💸</h1>
                </div>
            </div>
            <!-- Month Filter -->
            <div class="flex items-center space-x-2 space-x-reverse bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700 w-full sm:w-auto justify-center">
                <label for="globalMonth" class="text-xs font-semibold text-slate-400">شهر المتابعة:</label>
                <input type="month" id="globalMonth" class="bg-slate-800 text-white px-2 py-1 rounded-lg border border-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs">
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-2.5 sm:px-4 py-3 sm:py-6 flex-grow space-y-3 sm:space-y-6">

        <!-- Live Summary Cards -->
        <div class="grid grid-cols-2 gap-2.5 sm:gap-4">
            <div class="bg-slate-800 p-3 sm:p-4 rounded-2xl border border-slate-700 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs text-slate-400 font-bold mb-1">إجمالي الداخل</p>
                    <h3 id="statIncome" class="text-base sm:text-2xl font-black text-emerald-400">0 ج.م</h3>
                </div>
                <div class="bg-emerald-500/10 text-emerald-400 p-2.5 rounded-xl hidden sm:flex">
                    <i class="fa-solid fa-arrow-down-long text-xl"></i>
                </div>
            </div>

            <div class="bg-slate-800 p-3 sm:p-4 rounded-2xl border border-slate-700 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs text-slate-400 font-bold mb-1">إجمالي المصروفات</p>
                    <h3 id="statExpense" class="text-base sm:text-2xl font-black text-rose-400">0 ج.م</h3>
                </div>
                <div class="bg-rose-500/10 text-rose-400 p-2.5 rounded-xl hidden sm:flex">
                    <i class="fa-solid fa-arrow-up-long text-xl"></i>
                </div>
            </div>

            <div class="bg-slate-800 p-3 sm:p-4 rounded-2xl border border-slate-700 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs text-slate-400 font-bold mb-1">إجمالي الجمعيات</p>
                    <h3 id="statAssociation" class="text-base sm:text-2xl font-black text-amber-400">0 ج.م</h3>
                </div>
                <div class="bg-amber-500/10 text-amber-400 p-2.5 rounded-xl hidden sm:flex">
                    <i class="fa-solid fa-handshake text-xl"></i>
                </div>
            </div>

            <div class="bg-slate-800 p-3 sm:p-4 rounded-2xl border border-slate-700 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs text-slate-400 font-bold mb-1">صافي الفلوس</p>
                    <h3 id="statNet" class="text-base sm:text-2xl font-black text-cyan-400">0 ج.م</h3>
                </div>
                <div class="bg-cyan-500/10 text-cyan-400 p-2.5 rounded-xl hidden sm:flex">
                    <i class="fa-solid fa-scale-balanced text-xl"></i>
                </div>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="bg-slate-800 p-3.5 sm:p-6 rounded-2xl border border-slate-700 shadow-sm space-y-3">
            <h2 class="text-sm sm:text-base font-bold text-white flex items-center">
                <i class="fa-solid fa-plus-circle text-emerald-400 ml-2"></i> تسجيل حركة مالية جديدة أونلاين
            </h2>
            <form id="transactionForm" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-2.5 sm:gap-3 items-end">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">نوع الحركة</label>
                    <select id="txType" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="income">🟢 إيداع (فلوس دخلت)</option>
                        <option value="expense">🔴 صرف / جمعية (فلوس طلعت)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">الوسيلة / البند</label>
                    <select id="txWallet" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="🤝 قسط الجمعية">🤝 قسط الجمعية</option>
                        <option value="📱 إنستاباي (InstaPay)">📱 إنستاباي (InstaPay)</option>
                        <option value="🔴 فودافون كاش">🔴 فودافون كاش</option>
                        <option value="💵 كاش يدوي">💵 كاش يدوي</option>
                        <option value="🏦 حساب بنكي / أخرى">🏦 حساب بنكي / أخرى</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">المبلغ (ج.م)</label>
                    <input type="number" id="txAmount" placeholder="0.00" step="0.01" min="0" required class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">البيان / السبب</label>
                    <input type="text" id="txNote" placeholder="مثلاً: قسط شهر كذا، أكل..." required class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-900 font-bold py-2.5 px-4 rounded-xl shadow transition text-xs sm:text-sm">
                        <i class="fa-solid fa-check ml-1"></i> حفظ الحركة أونلاين
                    </button>
                </div>
            </form>
        </div>

        <!-- Transactions Table -->
        <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-sm overflow-hidden">
            <div class="p-3 bg-slate-800/80 border-b border-slate-700 font-bold text-white text-xs sm:text-sm flex justify-between items-center">
                <span>سجل العمليات والجمعيات (أونلاين)</span>
                <span id="txCount" class="text-[11px] text-slate-400">0 عملية</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-[11px] sm:text-sm">
                    <thead class="bg-slate-900 text-slate-400">
                        <tr>
                            <th class="p-2.5 sm:p-3">التاريخ</th>
                            <th class="p-2.5 sm:p-3">النوع</th>
                            <th class="p-2.5 sm:p-3">البند</th>
                            <th class="p-2.5 sm:p-3">البيان</th>
                            <th class="p-2.5 sm:p-3">المبلغ</th>
                            <th class="p-2.5 sm:p-3 text-center">حذف</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsTableBody" class="divide-y divide-slate-700/50"></tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-2.5 text-center text-[11px] text-slate-400 mt-auto">
        محفظتي الشخصية • متصل بقاعدة بيانات Firebase المنفصلة 🚀
    </footer>

    <!-- App Logic -->
    <script>
        let personalState = {
            transactions: []
        };

        async function loadDataFromFirebase() {
            if(!window.FB_db) return;
            try {
                const querySnapshot = await window.FB_getDocs(window.FB_collection(window.FB_db, "personal_wallet"));
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if(data && data.payload) {
                        personalState = data.payload;
                    }
                });
                render();
            } catch (e) {
                console.error("Error loading from firebase:", e);
            }
        }

        async function saveFirebaseData() {
            if(!window.FB_db) return;
            try {
                await window.FB_setDoc(window.FB_doc(window.FB_db, "personal_wallet", "my_wallet_db"), {
                    payload: personalState
                });
            } catch (e) {
                console.error("Error saving to firebase:", e);
            }
        }

        window.initAppFromFirebase = function() {
            loadDataFromFirebase();
        }

        function saveData() {
            saveFirebaseData();
            render();
        }

        const today = new Date();
        const currentYearMonth = today.toISOString().slice(0, 7);
        const globalMonthInput = document.getElementById('globalMonth');
        globalMonthInput.value = currentYearMonth;

        globalMonthInput.addEventListener('change', render);

        document.getElementById('transactionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const type = document.getElementById('txType').value;
            const wallet = document.getElementById('txWallet').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const note = document.getElementById('txNote').value.trim();

            personalState.transactions.push({
                id: Date.now(),
                date: today.toISOString().slice(0, 10),
                type: type, 
                wallet: wallet,
                amount: amount,
                note: note
            });

            saveData();
            document.getElementById('txAmount').value = '';
            document.getElementById('txNote').value = '';
        });

        function deleteTx(id) {
            if(confirm('هل أنت متأكد من حذف هذه الحركة؟')) {
                personalState.transactions = personalState.transactions.filter(t => t.id !== id);
                saveData();
            }
        }

        function render() {
            const selectedMonth = globalMonthInput.value;
            const filtered = personalState.transactions.filter(t => t.date && t.date.startsWith(selectedMonth));

            let totalIncome = 0;
            let totalExpense = 0;
            let totalAssociation = 0;

            filtered.forEach(t => {
                if(t.type === 'income') {
                    totalIncome += t.amount;
                } else {
                    totalExpense += t.amount;
                    if(t.wallet === '🤝 قسط الجمعية') {
                        totalAssociation += t.amount;
                    }
                }
            });

            const net = totalIncome - totalExpense;

            document.getElementById('statIncome').innerText = totalIncome.toLocaleString() + ' ج.م';
            document.getElementById('statExpense').innerText = totalExpense.toLocaleString() + ' ج.م';
            document.getElementById('statAssociation').innerText = totalAssociation.toLocaleString() + ' ج.م';
            
            const netEl = document.getElementById('statNet');
            netEl.innerText = net.toLocaleString() + ' ج.م';
            netEl.className = net >= 0 ? "text-base sm:text-2xl font-black text-cyan-400" : "text-base sm:text-2xl font-black text-rose-400";

            document.getElementById('txCount').innerText = filtered.length + ' عملية';

            const tbody = document.getElementById('transactionsTableBody');
            tbody.innerHTML = filtered.length === 0 ? `<tr><td colspan="6" class="p-4 text-center text-slate-500">لا توجد حركات مسجلة هذا الشهر</td></tr>` : '';

            filtered.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(t => {
                const isInc = t.type === 'income';
                const isAssoc = t.wallet === '🤝 قسط الجمعية';
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/30">
                        <td class="p-2.5 sm:p-3 text-slate-300">${t.date}</td>
                        <td class="p-2.5 sm:p-3 font-bold ${isInc ? 'text-emerald-400' : 'text-rose-400'}">
                            ${isInc ? '🟢 إيداع' : '🔴 صرف'}
                        </td>
                        <td class="p-2.5 sm:p-3 text-slate-300 font-semibold">${t.wallet}</td>
                        <td class="p-2.5 sm:p-3 text-slate-200">${t.note}</td>
                        <td class="p-2.5 sm:p-3 font-black ${isInc ? 'text-emerald-400' : (isAssoc ? 'text-amber-400' : 'text-rose-400')}">
                            ${isInc ? '+' : '-'}${t.amount.toLocaleString()} ج.م
                        </td>
                        <td class="p-2.5 sm:p-3 text-center">
                            <button onclick="deleteTx(${t.id})" class="text-rose-400 hover:text-rose-300 p-1"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        loadDataFromFirebase();
    </script>
</body>
</html>
